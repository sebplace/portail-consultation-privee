<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prototype de portail de prise de rendez-vous — Dr Mathieu Place, psychiatre. Démonstration à données fictives." />
  <title>Dr Mathieu Place — Prise de rendez-vous (prototype)</title>
  <meta name="theme-color" content="#3a5bd9" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5bd9'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EMP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    // Applique le thème avant le rendu (évite le flash clair/sombre).
    (function () {
      try {
        var t = localStorage.getItem('pcp.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>
  <div id="app"></div>
  <noscript>Ce prototype nécessite JavaScript.</noscript>
  <script type="module" src="assets/js/app.js"></script>
  <script>
    // Numéro de version affiché dans la bannière de mise à jour (aligné sur app.js).
    var APP_VERSION = 'v7';
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          function showUpdateBanner() {
            if (document.getElementById('update-banner')) return;
            var bar = document.createElement('div');
            bar.id = 'update-banner';
            bar.setAttribute('role', 'status');
            bar.appendChild(document.createTextNode('Une nouvelle version est disponible (' + APP_VERSION + '). '));
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'Actualiser';
            btn.onclick = function () {
              if (reg.waiting) reg.waiting.postMessage('skipWaiting');
              else location.reload();
            };
            bar.appendChild(btn);
            document.body.appendChild(bar);
          }
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
            });
          });
        }).catch(function () {});
      });
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
